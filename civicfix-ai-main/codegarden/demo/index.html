<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeGarden</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6fbf2;--card:#fff;--ink:#1b2e1f;--muted:#5c7060;--accent:#2f9e44;--line:#dcebd9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a13;--card:#18251c;--ink:#e6f3e8;--muted:#97ad9b;--line:#27402e}}
:root[data-theme="dark"]{--bg:#101a13;--card:#18251c;--ink:#e6f3e8;--muted:#97ad9b;--line:#27402e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}header{text-align:center}h1{margin:0;font-size:2.4rem}
header p{color:var(--muted);margin:4px 0 24px}.muted{color:var(--muted)}
.search{display:flex;gap:8px;flex-wrap:wrap}
select{flex:1;min-width:200px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.card{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
svg{width:100%;height:auto;border-radius:12px;display:block}
.slider{display:flex;gap:12px;align-items:center;margin:12px 0}.slider input{flex:1}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--accent);transition:width .4s}
.rows{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}.rows li{display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:99px;font-size:.9rem}
.fly{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{opacity:.2}}
.fall{animation:drop 6s linear infinite}@keyframes drop{to{transform:translateY(300px) rotate(90deg);opacity:0}}
small{display:block;margin-top:16px;color:var(--muted);text-align:center}
</style></head>
<body><main>
<header><h1>🌱 CodeGarden</h1><p>Grow your repository.</p></header>
<div class="search"><select id="repo"></select><button id="grow">🌱 Grow Garden</button></div>
<section class="card" id="out"></section>
<small>Demo uses illustrative sample numbers. The full project in <code>frontend/</code> + <code>backend/</code> fetches live GitHub data.</small>
</main>
<script>
const SAMPLES={
 "facebook/react":{description:"The library for web and native user interfaces",stars:230000,contributors:1700,commits:17000,mergedPRs:9800,releases:190,recentCommits:310},
 "vitejs/vite":{description:"Next generation frontend tooling",stars:68000,contributors:1100,commits:7000,mergedPRs:5200,releases:420,recentCommits:260},
 "new-owner/side-project":{description:"A young project with a small team",stars:340,contributors:9,commits:410,mergedPRs:120,releases:4,recentCommits:48},
 "old-owner/abandoned-lib":{description:"Last touched a long time ago",stars:1200,contributors:14,commits:900,mergedPRs:210,releases:11,recentCommits:0}
};
const sel=document.getElementById('repo'),out=document.getElementById('out');
Object.keys(SAMPLES).forEach(k=>sel.add(new Option(k,k)));
const seeded=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const score=s=>{const a=Math.min(s.recentCommits/100,1)*40,c=Math.min(s.contributors/100,1)*25,r=Math.min(s.releases/30,1)*20,p=Math.min(s.stars/10000,1)*15;return{a,c,r,p,t:Math.round(a+c+r+p)}};
const health=t=>t>=65?['🌻','Thriving']:t>=35?['🌱','Growing']:['🍂','Dormant'];
const lvl=(v,m)=>v/m>=.66?'High':v/m>=.33?'Moderate':'Low';
const fmt=n=>n.toLocaleString();
let current=null,t=100;

function garden(s,total,p){
 const dorm=total<35,r=seeded(s.commits+s.stars+11);
 const blob=n=>Array.from({length:n},()=>{const a=r()*6.283,d=Math.sqrt(r());return{x:300+Math.cos(a)*d*190,y:150+Math.sin(a)*d*105,s:4+r()*6,c:r()}});
 const L=blob(150),F=blob(45),Y=blob(32),nb=Math.max(3,Math.min(9,Math.round(Math.log2(s.contributors+1))));
 const nl=Math.round(Math.min(150,Math.sqrt(s.commits)*3)*p),nf=Math.round(Math.min(45,Math.sqrt(s.mergedPRs)*1.4)*p),ny=Math.round(Math.min(32,Math.log10(s.stars+1)*7)*p);
 const g=dorm?['#b08d57','#c9a66b','#a0703c']:['#2f9e44','#51cf66','#69db7c','#8ce99a'],pt=['#ff8fab','#ffd166','#f78fb3','#ffa94d'];
 const th=60+100*Math.max(.3,p);let h=`<svg viewBox="0 0 600 400" role="img" aria-label="Repository garden"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dorm?'#e9d8c4':'#cdeffd'}"/><stop offset="1" stop-color="${dorm?'#f6ead9':'#f1fbe9'}"/></linearGradient></defs><rect width="600" height="400" fill="url(#sky)"/><ellipse cx="300" cy="372" rx="320" ry="52" fill="${dorm?'#a98a5b':'#6ab04c'}"/><path d="M292 350 Q296 ${350-th/2} 300 ${350-th} Q304 ${350-th/2} 308 350Z" fill="#7b5233"/>`;
 for(let i=0;i<nb;i++){const q=i/(nb-1),x=300+(q-.5)*340,y=130+Math.abs(q-.5)*90+(160-th)*.4;h+=`<line x1="300" y1="${350-th}" x2="${x}" y2="${y}" stroke="#7b5233" stroke-width="3" stroke-linecap="round" opacity="${Math.min(1,p*2)}"/>`}
 L.slice(0,nl).forEach(l=>h+=`<ellipse cx="${l.x}" cy="${l.y+(dorm?l.c*40:0)}" rx="${l.s}" ry="${l.s*.6}" fill="${g[Math.floor(l.c*g.length)]}" opacity=".85" transform="rotate(${l.c*180} ${l.x} ${l.y})"/>`);
 F.slice(0,nf).forEach(f=>h+=`<circle cx="${f.x}" cy="${f.y}" r="${f.s*.8}" fill="${pt[Math.floor(f.c*4)]}"/><circle cx="${f.x}" cy="${f.y}" r="1.8" fill="#fff3bf"/>`);
 Y.slice(0,ny).forEach((f,i)=>h+=`<circle class="fly" style="animation-delay:${(i%7)*.4}s" cx="${f.x+(f.c-.5)*120}" cy="${f.y+60}" r="2.5" fill="#ffe066"/>`);
 if(dorm)for(let i=0;i<10;i++)h+=`<text class="fall" style="animation-delay:${i*.7}s" x="${90+i*48}" y="60" font-size="16">🍂</text>`;
 return h+'</svg>';
}
function render(){
 const d=SAMPLES[current],p=t/100,f=n=>Math.round(n*p);
 const v={...d,commits:f(d.commits),contributors:Math.max(1,f(d.contributors)),mergedPRs:f(d.mergedPRs),releases:f(d.releases),stars:f(d.stars),recentCommits:f(d.recentCommits)};
 const sc=score(v),[e,l]=health(sc.t);
 out.innerHTML=`<h3>${current}</h3><p class="muted">${d.description}</p>${garden(v,sc.t,p)}
 <label class="slider">⏳ Time travel <input id="tm" type="range" min="1" max="100" value="${t}"></label>
 <h2>${e} ${l}</h2><div class="bar"><div style="width:${sc.t}%"></div></div><p class="muted">Repository health · ${sc.t}%</p>
 <ul class="rows"><li><span>Recent activity</span><b>${lvl(sc.a,40)}</b></li><li><span>Community</span><b>${lvl(sc.c,25)}</b></li><li><span>Release activity</span><b>${lvl(sc.r,20)}</b></li><li><span>Popularity</span><b>${lvl(sc.p,15)}</b></li></ul>
 <div class="chips"><span>🌿 ${fmt(v.contributors)} contributors</span><span>🍃 ${fmt(v.commits)} commits</span><span>🌸 ${fmt(v.mergedPRs)} merged PRs</span><span>🌻 ${fmt(v.releases)} releases</span><span>✨ ${fmt(v.stars)} stars</span></div>`;
 document.getElementById('tm').oninput=e=>{t=+e.target.value;render()};
}
function grow(){current=sel.value;t=1;render();let n=1;const iv=setInterval(()=>{n+=3;t=Math.min(100,n);render();if(t>=100)clearInterval(iv)},30)}
document.getElementById('grow').onclick=grow;grow();
</script></body></html>
