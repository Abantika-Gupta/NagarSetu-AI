# Canonical Civic Categories & Multilingual Synonyms
categories:
  ROADS_POTHOLES:
    display_name: "Roads & Potholes"
    legacy_code: "road"
    description: "Damaged road, potholes, crater, asphalt collapse, broken pavement, footpath breakage"
    keywords: ["road", "pothole", "gaddha", "sadak", "rasta", "potholes", "crater", "footpath", "broken road", "tar"]
  GARBAGE_SOLID_WASTE:
    display_name: "Garbage & Solid Waste"
    legacy_code: "sanitation"
    description: "Overflowing garbage dump, uncollected waste, trash, littering, bio waste"
    keywords: ["garbage", "waste", "kachra", "dustbin", "trash", "dumping", "moyla", "aborjona", "litter", "rubbish"]
  DRAINAGE_FLOODING:
    display_name: "Drainage & Flooding"
    legacy_code: "drainage"
    description: "Waterlogging, choked stormwater drain, monsoon flooding, blocked culvert"
    keywords: ["drain", "drainage", "waterlogging", "nala", "flood", "stagnant water", "choked drain", "overflow"]
  STREETLIGHT:
    display_name: "Streetlight & Electrical"
    legacy_code: "electricity"
    description: "Dark street, non-functional light, blinking lamp, fallen electric pole, live wire"
    keywords: ["streetlight", "street light", "light", "pole", "wire", "dark", "andhera", "bulb", "fuse", "bijli"]
  WATER_SUPPLY:
    display_name: "Water Supply"
    legacy_code: "water"
    description: "Low pressure, no municipal water supply, contaminated water, yellow water"
